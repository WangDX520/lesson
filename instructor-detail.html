<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讲师详情 - 魔乐学堂</title>
    <style>
        :root {
            --dark-bg: #0a0e1a;
            --dark-card: #111827;
            --dark-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --text-muted: #6b7280;
            --primary-color: #00d4ff;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
            --accent-color: #00ff88;
            --glow-primary: 0 4px 16px rgba(0, 212, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--dark-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dark-border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            width: 200px;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dark-border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Instructor Header */
        .instructor-header {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(128, 0, 255, 0.1) 100%);
            border-radius: 16px;
            border: 1px solid var(--dark-border);
            padding: 40px;
            display: flex;
            gap: 32px;
            margin-bottom: 32px;
        }

        .instructor-avatar-large {
            width: 180px;
            height: 180px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 56px;
            flex-shrink: 0;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
        }

        .instructor-info {
            flex: 1;
        }

        .instructor-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .instructor-title {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .instructor-stats {
            display: flex;
            gap: 32px;
            margin-bottom: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .instructor-bio {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
            max-width: 800px;
        }

        /* Courses Section */
        .courses-section {
            background: var(--dark-card);
            border-radius: 16px;
            border: 1px solid var(--dark-border);
            padding: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .course-count {
            color: var(--text-muted);
            font-size: 14px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .course-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
        }

        .course-cover {
            width: 100%;
            height: 160px;
            overflow: hidden;
            position: relative;
        }

        .course-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .course-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: #fff;
        }

        .course-info {
            padding: 16px;
        }

        .course-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .course-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .meta-tag {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .meta-tag.difficulty {
            background: var(--gradient-primary);
            color: #fff;
        }

        .meta-tag.duration {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        .course-students {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .course-rating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .instructor-header {
                flex-direction: column;
                text-align: center;
            }
            
            .instructor-avatar-large {
                margin: 0 auto;
            }
            
            .instructor-stats {
                justify-content: center;
            }
            
            .course-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

            <nav class="nav-links">

            </nav>

            </div>
            <div class="course-grid" id="courseGrid">

        </div>
    </main>

        // 获取URL参数
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // 渲染讲师课程
        function renderInstructorCourses(courses) {
            const courseGrid = document.getElementById('courseGrid');
            courseGrid.innerHTML = courses.map(course => {
                const courseKey = course.title.toLowerCase().replace(/[\s\-\:\(\)]+/g, '');
                return `
                <div class="course-card" onclick="goToCourse('${courseKey}')">
                    <div class="course-cover">
                        <img src="${course.cover}" alt="${course.title}">
                        <div class="course-badge">📺 ${course.duration}</div>
                    </div>
                    <div class="course-info">
                        <h3>${course.title}</h3>
                        <div class="course-meta">
                            <span class="meta-tag difficulty">${course.difficulty}</span>
                            <span class="meta-tag duration">⏱ ${course.duration}</span>
                        </div>
                        <div class="course-footer">
                            <span class="course-students">👥 ${course.students}</span>
                            <span class="course-rating">⭐ ${course.rating}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // 跳转到课程详情
        function goToCourse(courseKey) {
            window.location.href = 'course-detail.html?course=' + encodeURIComponent(courseKey);
        }

        // 返回首页
        function goBack() {
            window.location.href = 'index.html';
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            const instructorName = getUrlParam('instructor');
            
            if (instructorName && instructors[instructorName]) {
                const instructor = instructors[instructorName];
                
                // 更新讲师信息
                document.getElementById('instructorAvatar').textContent = instructor.name.charAt(0);
                document.getElementById('instructorName').textContent = instructor.name;
                document.getElementById('instructorTitle').textContent = instructor.title;
                document.getElementById('instructorBio').textContent = instructor.bio;
                document.getElementById('courseCount').textContent = instructor.courses;
                document.getElementById('studentCount').textContent = instructor.students;
                document.getElementById('totalViews').textContent = instructor.totalViews;
                document.getElementById('totalCourses').textContent = instructor.courses;

                // 渲染讲师课程
                renderInstructorCourses(instructor.courseList);
            }
        });
    </script>
</body>
</html>
