<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部讲师 - 魔乐学堂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(10, 10, 26, 0.95);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: #b0b0b0;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #00d4ff;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Instructor Grid */
        .instructor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .instructor-card {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.8) 0%, rgba(15, 15, 35, 0.8) 100%);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .instructor-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .instructor-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.15);
        }

        .instructor-card:hover::before {
            opacity: 1;
        }

        .instructor-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .instructor-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .instructor-meta {
            flex: 1;
        }

        .instructor-name {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .instructor-title {
            font-size: 13px;
            color: #888;
        }

        .instructor-badges {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .instructor-badge {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .instructor-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #b0b0b0;
        }

        .stat-item span:first-child {
            font-size: 16px;
        }

        .instructor-desc {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .star-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .instructor-grid {
                grid-template-columns: 1fr;
            }

            .instructor-card {
                padding: 20px;
            }

            .instructor-avatar {
                width: 56px;
                height: 56px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">🎓 魔乐学堂</div>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="instructors.html" class="active">讲师团队</a>
                <a href="#">课程中心</a>

        function renderInstructors() {
            const grid = document.getElementById('instructorGrid');
            grid.innerHTML = instructors.map(instructor => `
                <div class="instructor-card" onclick="goToInstructor('${instructor.name}')">
                    ${instructor.isStar ? '<div class="star-badge">⭐ 明星讲师</div>' : ''}
                    <div class="instructor-header">
                        <div class="instructor-avatar" style="background: ${instructor.gradient};">${instructor.avatar}</div>
                        <div class="instructor-meta">
                            <div class="instructor-name">${instructor.name}</div>
                            <div class="instructor-title">${instructor.title}</div>
                        </div>
                    </div>
                    <div class="instructor-stats">
                        <div class="stat-item"><span>📚</span> ${instructor.courses}门课程</div>
                        <div class="stat-item"><span>👥</span> ${instructor.students} 学员</div>
                        <div class="stat-item"><span>👁️</span> ${instructor.views}播放</div>
                    </div>
                    <p class="instructor-desc">${instructor.desc}</p>
                </div>
            `).join('');
        }

        function goToInstructor(name) {
            window.location.href = 'instructor-detail.html?instructor=' + encodeURIComponent(name);
        }

        renderInstructors();
    </script>
</body>
</html>
